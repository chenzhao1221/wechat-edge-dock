[package]
name = "wechat-notify-module"
version = "0.1.0"
edition = "2024"

[dependencies]
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "fast_fmt", "code_asm", "instr_info"] }
memchr = "2.8.3"
object = { version = "0.40.0", default-features = false, features = ["read_core", "pe", "std"] }
rustc-hash = "2.1.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["ApplicationModel", "Foundation", "Management_Deployment", "System", "Win32_System_Com"] }
